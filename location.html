<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY AREA — Location</title><style>body{margin:0;background:#f6f6f6;font-family:Arial,sans-serif;color:#171717}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding-bottom:30px}.top{padding:20px 18px 10px}.brand{font-size:22px;font-weight:700}.brand span{color:#ff5a36}.content{padding:35px 24px;text-align:center}.pin{width:90px;height:90px;margin:auto;border-radius:28px;background:#fff0ec;display:grid;place-items:center;font-size:45px}.content h1{font-size:24px;margin:22px 0 9px}.content p{font-size:13px;line-height:1.55;color:#777;margin:0 auto;max-width:330px}.primary{width:100%;height:50px;margin-top:27px;border:0;border-radius:14px;background:#171717;color:#fff;font-weight:700;font-size:13px}.secondary{width:100%;height:48px;margin-top:10px;border:1px solid #e8e8e8;border-radius:14px;background:#fff;font-weight:600}.divider{display:flex;align-items:center;gap:10px;margin:25px 0;color:#aaa;font-size:11px}.divider:before,.divider:after{content:'';height:1px;background:#eee;flex:1}.form{text-align:left}.label{font-size:11px;font-weight:700;margin:12px 0 6px;display:block}.select{width:100%;height:45px;border:1px solid #e5e5e5;border-radius:12px;padding:0 12px;background:#fff}.hint{font-size:10px;color:#999;margin-top:5px}.saved{margin-top:15px;padding:12px;border-radius:12px;background:#f7f7f7;font-size:11px;color:#555}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:11px 15px;border-radius:10px;font-size:11px;display:none;white-space:nowrap}.toast.show{display:block}</style></head><body><main class="app"><header class="top"><div class="brand">MY <span>AREA</span></div></header><section class="content"><div class="pin">📍</div><h1>Set your location</h1><p>MY AREA uses your location to show shops, food, service providers, drivers and other useful things around you.</p><button class="primary" onclick="useLocation()">📍 Use my current location</button><button class="secondary" onclick="document.getElementById('manual').scrollIntoView({behavior:'smooth'})">Select my area manually</button><div id="locationStatus"></div><div class="divider">or</div><div id="manual" class="form"><b style="font-size:16px">My Area</b><span class="hint">You can change this anytime.</span><label class="label">State</label><select id="state" class="select"><option value="">Select state</option><option>Oyo</option><option>Lagos</option><option>Osun</option><option>Ogun</option><option>Other</option></select><label class="label">Local Government Area</label><select id="lga" class="select"><option value="">Select LGA</option></select><label class="label">Area / neighbourhood</label><input id="neighbourhood" class="select" placeholder="Enter your area or neighbourhood"><label class="label">Nearest landmark</label><input id="landmark" class="select" placeholder="Optional landmark"><button class="primary" onclick="saveArea()">Save my area</button></div></section><div id="toast" class="toast"></div></main><script>function toast(m){let t=document.getElementById('toast');t.textContent=m;t.className='toast show';setTimeout(()=>t.className='toast',2400)}function useLocation(){if(!navigator.geolocation){toast('Location is not supported on this device.');return}toast('Requesting your location…');navigator.geolocation.getCurrentPosition(p=>{const value={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,updatedAt:new Date().toISOString(),source:'current'};localStorage.setItem('areaLocation',JSON.stringify(value));document.getElementById('locationStatus').innerHTML='<div class="saved">📍 Current location saved · Accuracy about '+Math.round(p.coords.accuracy)+'m</div>';toast('Current location saved. Nearby results can now use it.')},e=>toast(e.code===1?'Location access was denied. You can select your area manually.':'Could not get your location. Please try again.'),{enableHighAccuracy:true,timeout:15000,maximumAge:10000})}function saveArea(){const state=document.getElementById('state').value,area=document.getElementById('neighbourhood').value.trim(),landmark=document.getElementById('landmark').value.trim();if(!state||!area){toast('Please select your state and enter your area.');return}localStorage.setItem('manualArea',JSON.stringify({state,area,landmark,updatedAt:new Date().toISOString()}));toast('Your area has been saved.')}</script></body></html>

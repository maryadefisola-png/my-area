<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY AREA — Rides</title><style>body{margin:0;background:#f6f6f6;font-family:Arial;color:#171717}.app{max-width:480px;margin:auto;min-height:100vh;background:white}.top{padding:18px;display:flex;gap:12px;align-items:center}.back{border:0;border-radius:50%;width:38px;height:38px;font-size:22px}.title{font-size:21px;font-weight:700}.sub{font-size:11px;color:#777;margin-top:3px}.map{height:230px;background:linear-gradient(140deg,#e7eee6,#f6f1e8);position:relative;overflow:hidden}.road{position:absolute;width:140%;height:22px;background:#fff;transform:rotate(-22deg);top:105px;left:-30px;box-shadow:0 1px 0 #ddd}.pin{position:absolute;left:48%;top:44%;font-size:30px}.panel{padding:18px}.field{border:1px solid #e5e5e5;border-radius:14px;padding:13px;margin-bottom:10px}.field small{display:block;color:#777;font-size:10px;margin-bottom:4px}.field b{font-size:13px}.ride{margin-top:20px}.ride h2{font-size:17px}.cards{display:flex;gap:11px;overflow:auto}.card{min-width:185px;border:1px solid #e8e8e8;border-radius:15px;padding:13px}.car{font-size:30px}.card b{font-size:13px}.meta{font-size:10px;color:#777;margin-top:5px}.fare{font-size:13px;font-weight:700;margin-top:9px}.choose{margin-top:20px;width:100%;height:48px;border:0;border-radius:13px;background:#171717;color:#fff;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:68px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center}.nav button{border:0;background:none;color:#888;font-size:10px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#171717;color:white;padding:10px 14px;border-radius:10px;font-size:11px;display:none}.toast.show{display:block}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='index.html'">‹</button><div><div class="title">Rides</div><div class="sub">📍 Drivers available around you</div></div></header><div class="map"><div class="road"></div><div class="pin">📍</div></div><section class="panel"><div class="field"><small>Pickup location</small><b>📍 Your current location</b></div><div class="field"><small>Where are you going?</small><b>⌕ Enter destination</b></div><div class="ride"><h2>Available rides</h2><div class="cards"><article class="card"><div class="car">🚗</div><b>Standard</b><div class="meta">4 seats · 3 min away</div><div class="fare">From ₦1,500</div></article><article class="card"><div class="car">🚙</div><b>Comfort</b><div class="meta">4 seats · 5 min away</div><div class="fare">From ₦2,000</div></article><article class="card"><div class="car">🚐</div><b>XL</b><div class="meta">6 seats · 7 min away</div><div class="fare">From ₦2,800</div></article></div></div><button class="choose" onclick="show('Enter a destination to request a ride.')">Choose a ride</button></section><nav class="nav"><button onclick="location.href='index.html'">⌂<br>Home</button><button onclick="location.href='shops.html'">⌕<br>Explore</button><button onclick="show('Orders will appear here.')">▱<br>Orders</button><button onclick="show('Profile will appear here.')">○<br>Profile</button></nav><div id="toast" class="toast"></div></main><script>function show(m){let t=document.getElementById('toast');t.textContent=m;t.className='toast show';setTimeout(()=>t.className='toast',1800)}</script></body></html>
